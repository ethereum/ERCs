<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Push style: transaction execution via execute()</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="840" height="440" fill="#ffffff"/>

  <!-- lifelines -->
  <g stroke="#999" stroke-width="1" stroke-dasharray="4 4">
    <line x1="140" y1="64" x2="140" y2="376"/>
    <line x1="420" y1="64" x2="420" y2="376"/>
    <line x1="700" y1="64" x2="700" y2="376"/>
  </g>

  <!-- participants (top / bottom) -->
  <g fill="#eaeaea" stroke="#666" stroke-width="1.2">
    <rect x="30" y="20" width="220" height="44" rx="4"/>
    <rect x="310" y="20" width="220" height="44" rx="4"/>
    <rect x="590" y="20" width="220" height="44" rx="4"/>
    <rect x="30" y="376" width="220" height="44" rx="4"/>
    <rect x="310" y="376" width="220" height="44" rx="4"/>
    <rect x="590" y="376" width="220" height="44" rx="4"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="140" y="47">Off-chain signer (delegate)</text>
    <text x="420" y="47">DelegationContract</text>
    <text x="700" y="47">Integrator contract</text>
    <text x="140" y="403">Off-chain signer (delegate)</text>
    <text x="420" y="403">DelegationContract</text>
    <text x="700" y="403">Integrator contract</text>
  </g>

  <!-- messages -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="140" y1="120" x2="418" y2="120" marker-end="url(#arrow)"/>
    <line x1="420" y1="170" x2="698" y2="170" marker-end="url(#arrow)"/>
    <line x1="700" y1="290" x2="422" y2="290" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <line x1="420" y1="340" x2="142" y2="340" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="280" y="110">execute(target, data)</text>
    <text x="560" y="160">call(target, data)</text>
    <text x="560" y="280">result</text>
    <text x="280" y="330">result</text>
  </g>

  <!-- note over integrator -->
  <rect x="575" y="198" width="250" height="44" fill="#fff5ad" stroke="#aaaa33" stroke-width="1"/>
  <text x="700" y="225" fill="#111" text-anchor="middle">msg.sender == DelegationContract</text>
</svg>
