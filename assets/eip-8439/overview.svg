<?plantuml 1.2026.0?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="151px" preserveAspectRatio="none" style="width:1673px;height:151px;background:#FFFFFF;" version="1.1" viewBox="0 0 1673 151" width="1673px" zoomAndPan="magnify"><title>Settlement-Decoupled Nanopayment Ledger: Core Flow</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="440.3916" x="609.7243" y="22.9951">Settlement-Decoupled Nanopayment Ledger: Core Flow</text></g><!--entity step1--><g class="entity" data-qualified-name="step1" data-source-line="16" id="ent0002"><rect fill="#F1F6FB" height="85.1875" rx="6" ry="6" style="stroke:#536A7B;stroke-width:0.5;" width="256.6533" x="7" y="52.4369"/><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="13.3574" x="17" y="75.432">1.</text><text fill="#1D354A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="180.209" x="34.8076" y="75.432">User initiates payment</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="91.7289">&#160;</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.1084" x="17" y="108.0257">The user requests payment</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.6533" x="17" y="124.3226">through a participating institution</text></g><!--entity step2--><g class="entity" data-qualified-name="step2" data-source-line="17" id="ent0003"><rect fill="#F1F6FB" height="101.4844" rx="6" ry="6" style="stroke:#536A7B;stroke-width:0.5;" width="302.5566" x="283.65" y="44.2969"/><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="13.3574" x="293.65" y="67.292">2.</text><text fill="#1D354A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178.6504" x="311.4576" y="67.292">Parties verify and sign</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="293.65" y="83.5889">&#160;</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.124" x="293.65" y="99.8857">The payer institution,</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.5566" x="293.65" y="116.1826">payee institution, and Payment Network</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.9014" x="293.65" y="132.4795">verify the transaction and sign</text></g><!--entity step3--><g class="entity" data-qualified-name="step3" data-source-line="18" id="ent0004"><rect fill="#F1F6FB" height="85.1875" rx="6" ry="6" style="stroke:#536A7B;stroke-width:0.5;" width="229.0977" x="606.21" y="52.4369"/><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="13.3574" x="616.21" y="75.432">3.</text><text fill="#1D354A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="128.8984" x="634.0176" y="75.432">Submit on-chain</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="616.21" y="91.7289">&#160;</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.0977" x="616.21" y="108.0257">The submitter sends requests</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.1064" x="616.21" y="124.3226">individually or in a batch</text></g><!--entity step4--><g class="entity" data-qualified-name="step4" data-source-line="19" id="ent0005"><rect fill="#F1F6FB" height="85.1875" rx="6" ry="6" style="stroke:#536A7B;stroke-width:0.5;" width="240.7393" x="855.31" y="52.4369"/><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="13.3574" x="865.31" y="75.432">4.</text><text fill="#1D354A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="142.7275" x="883.1176" y="75.432">Post to the ledger</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="865.31" y="91.7289">&#160;</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.8096" x="865.31" y="108.0257">The ledger validates requests,</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.7393" x="865.31" y="124.3226">posts entries, and emits events</text></g><!--entity step5--><g class="entity" data-qualified-name="step5" data-source-line="20" id="ent0006"><rect fill="#F1F6FB" height="85.1875" rx="6" ry="6" style="stroke:#536A7B;stroke-width:0.5;" width="297.3477" x="1116.05" y="52.4369"/><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="13.3574" x="1126.05" y="75.432">5.</text><text fill="#1D354A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="137.1289" x="1143.8576" y="75.432">Close statements</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1126.05" y="91.7289">&#160;</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.2412" x="1126.05" y="108.0257">Institutions call flush periodically</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277.3477" x="1126.05" y="124.3226">as agreed to close on-chain statements</text></g><!--entity step6--><g class="entity" data-qualified-name="step6" data-source-line="21" id="ent0007"><rect fill="#F1F6FB" height="85.1875" rx="6" ry="6" style="stroke:#536A7B;stroke-width:0.5;" width="234.4502" x="1433.39" y="52.4369"/><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="13.3574" x="1443.39" y="75.432">6.</text><text fill="#1D354A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="154.123" x="1461.1976" y="75.432">Settle fiat off-chain</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1443.39" y="91.7289">&#160;</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.374" x="1443.39" y="108.0257">Off-chain fiat systems settle</text><text fill="#1D354A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.4502" x="1443.39" y="124.3226">on the basis of the statements</text></g><!--link step1 to step2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="22" id="lnk8"><path d="M263.83,95.0369 C270.3,95.0369 270.82,95.0369 277.35,95.0369" fill="none" id="step1-to-step2" style="stroke:#536A7B;stroke-width:1;"/><polygon fill="#536A7B" points="283.35,95.0369,274.35,91.0369,278.35,95.0369,274.35,99.0369,283.35,95.0369" style="stroke:#536A7B;stroke-width:1;"/></g><!--link step2 to step3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="23" id="lnk9"><path d="M586.57,95.0369 C593.07,95.0369 593.55,95.0369 599.95,95.0369" fill="none" id="step2-to-step3" style="stroke:#536A7B;stroke-width:1;"/><polygon fill="#536A7B" points="605.95,95.0369,596.95,91.0369,600.95,95.0369,596.95,99.0369,605.95,95.0369" style="stroke:#536A7B;stroke-width:1;"/></g><!--link step3 to step4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="24" id="lnk10"><path d="M835.64,95.0369 C842.06,95.0369 842.53,95.0369 848.98,95.0369" fill="none" id="step3-to-step4" style="stroke:#536A7B;stroke-width:1;"/><polygon fill="#536A7B" points="854.98,95.0369,845.98,91.0369,849.98,95.0369,845.98,99.0369,854.98,95.0369" style="stroke:#536A7B;stroke-width:1;"/></g><!--link step4 to step5--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="25" id="lnk11"><path d="M1096.33,95.0369 C1102.79,95.0369 1103.32,95.0369 1109.86,95.0369" fill="none" id="step4-to-step5" style="stroke:#536A7B;stroke-width:1;"/><polygon fill="#536A7B" points="1115.86,95.0369,1106.86,91.0369,1110.86,95.0369,1106.86,99.0369,1115.86,95.0369" style="stroke:#536A7B;stroke-width:1;"/></g><!--link step5 to step6--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="26" id="lnk12"><path d="M1413.49,95.0369 C1420.09,95.0369 1420.68,95.0369 1427.19,95.0369" fill="none" id="step5-to-step6" style="stroke:#536A7B;stroke-width:1;"/><polygon fill="#536A7B" points="1433.19,95.0369,1424.19,91.0369,1428.19,95.0369,1424.19,99.0369,1433.19,95.0369" style="stroke:#536A7B;stroke-width:1;"/></g><?plantuml-src RLDDRzim3BtdLn3TBLY6ELy3TXZGf0WmOEYAPRtvebYqBKIXF8bEa0txxwEKr56n-c23ZnRVuoF5XYt25ba-1oIUF63b-iwYXaT5hbFdYC8tr0twpx1s7c5ZtMbaiMPW1zuqBOCs7YisZaPXRwXJNXrWfwfzurrFUksiy_1kavxiZz0gxKw66gYL3PXbo6aCs46np42lQ1_1wSSCr5YhtlB64J-gWxIYA6pHc_hjVxRcDq8npvBtthlJLU5Yjhp_jCeffIj5ZLZqPmIm-g-ZOhFSh6B6UOt-THM0I7Z5YeVPOduls8_BSK_eePYE_evk57V51nYFduDa31asYZ70TGBZSKab_MmH-fZt-Al7m4Ew96v5MDE24iYpgKodE3fhAB3XFixc3bI0mDWLEUaqaZx5Cy9sZCwTGP66O1gwiGfFaZKKUrzInF0LbWu-NNVc4Vda_BwaQr6MCYmp32fjoa0oo9hcicPHrhRV7Go3eqdLAfF92Id18YaWwJ3uKP8XROv6zyhQCxWeMIpPAQxQWMUMyynJ-owaPOuIRLhr6zKbXgEoHgU9l7151roSWJJhnRnBzoYw13eA60R6USwuY8nhwuAqmL8ncXKkV5zlNWQef0MeRHzQwCH1fqr4pYL9KTLub2igagjKwCMXhE90liZ9bydMTDsXbWq3LzUvkTzVmaisdAN2GUga4oN9sA97EnLCaACfU8DIRcrSCvXClbmdczv3F4lnR8ZdAPuFyIB5Yo5U_WC0?></g></svg>