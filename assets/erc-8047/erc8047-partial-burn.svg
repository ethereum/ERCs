<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="100%"
    style="background-color: #ffffff;">
    <defs>
        <style>
            /* Node Styles */
            .node-rect-burned { fill: #fcf2f2; stroke: #a30000; stroke-width: 1px; rx: 3px; stroke-dasharray: 2,2; }
            .action-rect-burn { fill: #fcf2f2; stroke: #a30000; stroke-width: 1px; rx: 3px; }
            
            /* Typography */
            .txt { font-family: "Latin Modern Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; fill: #000000; }
            .txt-bold { font-weight: bold; }
            .txt-strike { text-decoration: line-through; fill: #888888; }
            .grid-lbl { font-family: "Latin Modern Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #555555; text-anchor: middle; font-style: italic; }
            
            /* Edges and Grids */
            .edge { fill: none; stroke: #a30000; stroke-width: 1.5px; stroke-dasharray: 4,4; marker-end: url(#arrow); }
            .flow-edge { fill: none; stroke: #555555; stroke-width: 1.5px; marker-end: url(#arrow-gray); }
            .grid { fill: none; stroke: #cccccc; stroke-width: 1.5px; stroke-dasharray: 2,4; }
        </style>

        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6"
            orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#a30000" />
        </marker>
        <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6"
            markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
        </marker>
    </defs>

    <!-- Headers -->
    <text x="380" y="40" class="grid-lbl">Depth = n</text>

    <!-- Center Grid Separator -->
    <path d="M 267.5 50 L 267.5 200" class="grid" />

    <!-- ================= Edges ================= -->

    <!-- Main Flow Edge (Left to Right: Burn Action -> Mutated Token) -->
    <path d="M 245 110 L 305 110" class="flow-edge" />

    <!-- ================= Edge Labels ================= -->
    <text x="275" y="105" class="txt" style="fill: #555555; text-anchor: middle; font-style: italic;">mutates</text>

    <!-- ================= Nodes ================= -->

    <!-- Left Box: Action Burn Operation -->
    <g transform="translate(65, 60)">
        <rect class="action-rect-burn" width="180" height="100" />
        <text class="txt-bold" x="90" y="22" style="text-anchor: middle; fill: #a30000;">Operation: Burn</text>
        <path d="M 0 30 L 180 30" style="fill: none; stroke: #ffcdd2; stroke-width: 1px;" />

        <text class="txt" x="12" y="50">target: ID 0x2A...</text>
        <text class="txt" x="12" y="68">amount: 50</text>
    </g>

    <!-- Right Box: Mutated Token (Resulting State) -->
    <g transform="translate(315, 60)">
        <rect class="node-rect-burned" width="130" height="100" />
        <text class="txt" x="8" y="18">
            <tspan class="txt-bold">ID 0x2A...</tspan>
        </text>
        <text class="txt" x="8" y="32">Root 0xFF...</text>
        <text class="txt" x="8" y="46">Parent 0xDE...</text>
        <text class="txt" x="8" y="60">Value <tspan class="txt-strike">100</tspan> → <tspan
                class="txt-bold">50</tspan></text>
        <text class="txt" x="8" y="74">Depth n</text>
        <text class="txt" x="8" y="88">Owner Alice</text>
    </g>

</svg>
