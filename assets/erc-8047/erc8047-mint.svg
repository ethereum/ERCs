<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="100%" style="background-color: #ffffff;">
    <defs>
        <style>
            /* Node Styles */
            .node-rect { fill: #f2f7fc; stroke: #333333; stroke-width: 1px; rx: 3px; }
            .action-rect { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1px; rx: 3px; }
            
            /* Typography */
            .txt { font-family: "Latin Modern Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; fill: #000000; }
            .txt-bold { font-weight: bold; }
            .grid-lbl { font-family: "Latin Modern Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #555555; text-anchor: middle; font-style: italic; }
            
            /* Edges and Grids */
            .edge { fill: none; stroke: #a30000; stroke-width: 1.5px; stroke-dasharray: 4,4; marker-end: url(#arrow); }
            .flow-edge { fill: none; stroke: #555555; stroke-width: 1.5px; marker-end: url(#arrow-gray); }
            .grid { fill: none; stroke: #cccccc; stroke-width: 1.5px; stroke-dasharray: 2,4; }
        </style>

        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#a30000" />
        </marker>
        <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
        </marker>
    </defs>

    <!-- Depth Headers -->
    <text x="445" y="40" class="grid-lbl">Depth = 0</text>

    <!-- Depth Grid Separators -->
    <path d="M 320 50 L 320 200" class="grid" />

    <!-- ================= Edges ================= -->
    
    <!-- Main Flow Edge (Mint Action -> Resulting Token) -->
    <path d="M 230 110 L 372 110" class="flow-edge" />
    
    <!-- ================= Edge Labels ================= -->
    <text x="300" y="105" class="txt" style="fill: #555555; text-anchor: middle; font-style: italic;">creates</text>

    <!-- ================= Nodes ================= -->
    
    <!-- Action: Mint Operation -->
    <g transform="translate(50, 60)">
        <rect class="action-rect" width="180" height="100" />
        <text class="txt-bold" x="90" y="22" style="text-anchor: middle; fill: #1b5e20;">Operation: Mint</text>
        <path d="M 0 30 L 180 30" style="fill: none; stroke: #c8e6c9; stroke-width: 1px;" />
        
        <text class="txt" x="12" y="50">to: Alice</text>
        <text class="txt" x="12" y="68">amount: 1000</text>
        <text class="txt" x="12" y="86">root: generateId()</text>
    </g>

    <!-- L0: Alice (Resulting State) -->
    <g transform="translate(380, 60)">
        <rect class="node-rect" width="130" height="100" />
        <text class="txt" x="8" y="18"><tspan class="txt-bold">ID 01</tspan> (Root)</text>
        <text class="txt" x="8" y="32">Root 01</text>
        <text class="txt" x="8" y="46">Parent 0</text>
        <text class="txt" x="8" y="60">Value 1000</text>
        <text class="txt" x="8" y="74">Depth 0</text>
        <text class="txt" x="8" y="88">Owner Alice</text>
    </g>

</svg>
