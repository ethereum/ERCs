on:
  schedule:
    # A job that runs every sunday at 00:00
    - cron:  '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report what would change without opening, merging or closing anything'
        type: boolean
        default: true

name: Auto Stagnant Bot

permissions:
  contents: read

jobs:
  auto_stagnant_bot:
    # The script derives the proposal kind, directory and branch prefix from
    # the repository name, so this runs unchanged in ethereum/EIPs.
    if: github.repository == 'ethereum/ERCs' || github.repository == 'ethereum/EIPs'
    runs-on: ubuntu-latest
    name: Auto Stagnant Bot
    steps:
      - name: Checkout
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f
        with:
          # Last edited dates are read from the commit log rather than the API.
          fetch-depth: 0
      - name: Auto Stagnant Bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: auto-stagnant-bot
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          # Must be a token with write access to this repository: it creates
          # refs, opens pull requests and merges them. In ethereum/ERCs that is
          # eip-review-bot, which is what the review bot's secrets.TOKEN holds;
          # a read-only token such as eth-bot's would 403 on the first createRef.
          github-token: ${{ secrets.TOKEN }}
          script: |
            const markStagnant = require('${{ github.workspace }}/.github/scripts/mark-stagnant-ercs.js')
            await markStagnant({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true'
            })
